<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Aadi ❤️ FINAL</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap');

body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
text-align:center;
overflow-x:hidden;
transition:1s;
}

.container{
max-width:750px;
margin:40px auto;
background:rgba(255,255,255,0.92);
padding:35px;
border-radius:25px;
box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

h1{
font-family:'Dancing Script',cursive;
font-size:3.3rem;
color:#e63946;
}

.subtitle{
color:#d62828;
font-weight:600;
}

button{
margin:6px;
padding:12px 18px;
border:none;
border-radius:50px;
background:#ff4d6d;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-3px);
background:#e63946;
}

.hidden{
display:none;
margin-top:15px;
padding:15px;
border-radius:12px;
background:#fff;
border-left:5px solid #ff4d6d;
}

#counter{
margin:15px 0;
color:#e63946;
font-weight:600;
}

.heart{
font-size:2rem;
animation:beat 1.5s infinite;
}

@keyframes beat{
0%,100%{transform:scale(1);}
50%{transform:scale(1.2);}
}

.fh{
position:fixed;
bottom:-20px;
color:#ff4d6d;
animation:float 6s linear infinite;
}

@keyframes float{
to{transform:translateY(-110vh);opacity:0;}
}

.night{
background:linear-gradient(180deg,#0d1b2a,#1b263b);
color:white;
}

.star{
position:fixed;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite;
}

@keyframes twinkle{
50%{opacity:0.2;}
}

.lock{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:9999;
}

input{
padding:10px;
border-radius:10px;
border:none;
text-align:center;
margin:10px;
}
</style>
</head>

<body>

<!-- 🔐 LOCK SCREEN -->
<div class="lock" id="lock">
<h2>🔐 Enter Password</h2>
<p>Hint: DDMMYYYY ❤️</p>
<input type="password" id="pass">
<button onclick="check()">Unlock</button>
</div>

<!-- 🎵 MUSIC (LOCAL MP3 - 100% WORKING) -->
<audio id="bgMusic" loop>
    <source src="aditya.mp3.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>Happy Birthday Aadi 🎉</h1>
<p class="subtitle">❤️ You are my forever person ❤️</p>

<div class="heart">❤️</div>

<div id="counter"></div>

<!-- 🎵 MUSIC BUTTON -->
<button onclick="toggleMusic()">🎵 Play / Pause Music</button>

<br><br>

<button onclick="toggle('fact')">Fact 💖</button>
<button onclick="showReason()">Why I Love You ❤️</button>
<button onclick="toggle('letter')">Letter 💌</button>
<button onclick="surprise()">Magic ✨</button>
<button onclick="night()">Night 🌙</button>
<button onclick="finalMsg()">Final 🎁</button>

<div id="fact" class="hidden">
Your Aadu loves you endlessly ❤️🥺
</div>

<div id="reason" class="hidden"></div>

<div id="letter" class="hidden">
<h3>💌 Dear Aadi</h3>
<p>You are my peace, my happiness, my everything ❤️</p>
</div>

<div id="final" class="hidden"></div>

</div>

<script>

let music=document.getElementById("bgMusic");

/* counter */
function counter(){
let start=new Date("2026-03-07");
let now=new Date();
let diff=now-start;
let days=Math.floor(diff/(1000*60*60*24));
document.getElementById("counter").innerHTML=
`❤️ Together for ${days} days ❤️`;
}
counter();

/* toggle */
function toggle(id){
let el=document.getElementById(id);
el.style.display=el.style.display==="block"?"none":"block";
}

/* reasons */
const reasons=[
"Your smile heals me ❤️",
"You are my comfort 🥺",
"You are my favorite human 💕",
"You make life better ✨"
];

function showReason(){
document.getElementById("reason").style.display="block";
document.getElementById("reason").innerHTML=
reasons[Math.floor(Math.random()*reasons.length)];
}

/* confetti */
function surprise(){
for(let i=0;i<100;i++){
let d=document.createElement("div");
d.className="fh";
d.innerHTML="❤️";
d.style.left=Math.random()*100+"vw";
d.style.animationDuration=(3+Math.random()*3)+"s";
document.body.appendChild(d);
setTimeout(()=>d.remove(),5000);
}
}

/* night */
function night(){
document.body.classList.toggle("night");
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}
}

/* MUSIC */
function toggleMusic(){
if(music.paused) music.play();
else music.pause();
}

/* FINAL */
function finalMsg(){
document.getElementById("final").style.display="block";
document.getElementById("final").innerHTML=
"❤️ I will always choose you, in every lifetime ❤️";
}

/* unlock */
function check(){
let pass=document.getElementById("pass").value;

if(pass==="07032026"){
document.getElementById("lock").style.display="none";
} else {
alert("Wrong password ❤️ Hint: DDMMYYYY");
}
}

</script>

</body>
</html>
